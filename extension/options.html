<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Pund-IT Meeting Assistant Auto-Record — Options</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 24px auto; padding: 0 12px; }
    label { display: block; font-weight: 600; margin: 14px 0 4px; }
    input[type=number], input[type=text] { width: 100%; padding: 8px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 8px 14px; }
    .status { margin-top: 12px; font-size: 14px; }
    .ok { color: #188038; } .bad { color: #c5221f; }
    small { color: #666; }
    .toggle { display: flex; align-items: center; gap: 8px; margin-top: 18px; }
    .toggle label { margin: 0; }
    #logwrap { display: none; margin-top: 16px; }
    #logwrap.show { display: block; }
    pre#log {
      background: #0f172a; color: #d1e5ff; font-size: 11px; line-height: 1.45;
      padding: 10px; border-radius: 6px; max-height: 320px; overflow: auto; white-space: pre-wrap;
    }
    .tabbtn { margin: 0 8px 0 0; padding: 6px 10px; font-size: 13px; }
    .tabbtn.active { background: #e8eaed; font-weight: 600; }
    h3 { margin-top: 24px; }
  </style>
</head>
<body>
  <h2>Pund-IT Meeting Assistant Auto-Record</h2>
  <p><small>Paste the token from Pund-IT Meeting Assistant → Settings → Preferences → Auto-record. Port must match the app's trigger server (default 7788).</small></p>

  <label for="port">Pund-IT Meeting Assistant port</label>
  <input id="port" type="number" value="7788" />
  <label for="token">Access token</label>
  <input id="token" type="text" placeholder="paste token from Pund-IT Meeting Assistant settings" autocomplete="off" />
  <button id="save">Save</button>
  <button id="test">Test connection</button>
  <div id="status" class="status"></div>

  <div class="toggle">
    <input id="notify" type="checkbox" />
    <label for="notify">Notifications (meeting detected / recording started / stopped / errors)</label>
  </div>
  <div class="toggle">
    <input id="debug" type="checkbox" />
    <label for="debug">Debug mode (verbose logging below + console output)</label>
  </div>

  <div class="toggle">
    <input id="force" type="checkbox" />
    <label for="force">Force trigger on meeting URL only (no UI checks — use if detection fails)</label>
  </div>

  <button id="forceStart">Start recording now (manual)</button>
  <button id="forceStop">Stop recording (manual)</button>

  <button id="copyLog">Copy debug log</button>
  <button id="probe">Probe meeting tab now</button>
  <div id="logwrap">
    <h3>Live debug log</h3>
    <p><small>Worker state machine + transport, then per-tab detection logs from any open meeting pages.</small></p>
    <pre id="log">…</pre>
  </div>

  <script src="options.js"></script>
</body>
</html>
