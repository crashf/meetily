<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Meetily Auto-Record — Options</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 24px auto; padding: 0 12px; }
    label { display: block; font-weight: 600; margin: 14px 0 4px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 8px 14px; }
    .status { margin-top: 12px; font-size: 14px; }
    .ok { color: #188038; } .bad { color: #c5221f; }
    small { color: #666; }
  </style>
</head>
<body>
  <h2>Meetily Auto-Record</h2>
  <p><small>Paste the token shown in Meetily → Settings → Preferences → Auto-record. Port must match the app's trigger server (default 7788).</small></p>
  <label for="port">Meetily port</label>
  <input id="port" type="number" value="7788" />
  <label for="token">Access token</label>
  <input id="token" type="text" placeholder="paste token from Meetily settings" autocomplete="off" />
  <button id="save">Save</button>
  <button id="test">Test connection</button>
  <div id="status" class="status"></div>
  <script src="options.js"></script>
</body>
</html>
